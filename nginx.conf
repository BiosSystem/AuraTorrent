server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # AuraTorrent is a single-page app talking to a qBittorrent WebUI on the
    # same origin (proxied) or a configured target. These headers assume that
    # deployment shape: no third-party scripts, no cross-origin frames.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
