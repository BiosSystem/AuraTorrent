# Major versions are ignored for every ecosystem and upgraded by hand, one
# repository at a time; a vulnerability that needs a major still shows up as
# a Dependabot alert.
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      all:
        patterns:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      env:
        patterns:
        - '*node*'
        - '*vite*'
      lint:
        patterns:
        - '*eslint*'
        - '*prettier*'
      framework:
        patterns:
        - '@vue/*'
        - '*vue*'
        - '*vuetify*'
        - '*pinia*'
      patch:
        update-types: ["patch"]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 reports `.value` on template v-models bound to reactive
      # objects and Pinia stores (formData.add, vueTorrentStore.logoutUrl),
      # code that has no `.value`. 3.3.13 type-checks clean. Drop this once a
      # newer 3.3.x passes `npm run build`.
      - dependency-name: 'vue-tsc'
        versions: ['3.3.14']
