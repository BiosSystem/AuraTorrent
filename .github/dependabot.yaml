# Major versions are ignored for every ecosystem and upgraded by hand, one
# repository at a time; a vulnerability that needs a major still shows up as
# a Dependabot alert.
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      all:
        patterns:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      env:
        patterns:
        - '*node*'
        - '*vite*'
      lint:
        patterns:
        - '*eslint*'
        - '*prettier*'
      framework:
        patterns:
        - '@vue/*'
        - '*vue*'
        - '*vuetify*'
        - '*pinia*'
      patch:
        update-types: ["patch"]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
