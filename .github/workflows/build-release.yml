name: Build and Release AuraTorrent

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build AuraTorrent (${{ matrix.npm-step }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        npm-step: ['build', 'build-demo']
        include:
          - npm-step: build
            artifact-name: auratorrent-build
            artifact-path: ./auratorrent
          - npm-step: build-demo
            artifact-name: auratorrent-demo
            artifact-path: ./vuetorrent-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build AuraTorrent
        run: |
          version=$(git describe --tags --exclude latest_nightly 2>/dev/null || node -p "require('./package.json').version")
          npm version --no-commit-hooks --no-git-tag-version --allow-same-version "$version"
          npm run ${{ matrix.npm-step }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 1

  push-nightly:
    name: Push to nightly branch
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: auratorrent-build
          path: ./auratorrent

      - name: Push to nightly-release branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: nightly-release
          folder: ./auratorrent

      - name: Update nightly tag
        run: |
          git tag -f latest_nightly
          git push -f origin latest_nightly

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: auratorrent-build
          path: ./auratorrent

      - name: Zip AuraTorrent
        run: zip -qq -r ./auratorrent.zip ./auratorrent

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: AuraTorrent ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: ./auratorrent.zip

  push-release:
    name: Push to latest-release branch
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: auratorrent-build
          path: ./auratorrent

      - name: Push to latest-release branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: latest-release
          folder: ./auratorrent

  publish-image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/auratorrent
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha
            type=ref,event=tag

      - name: Build and push nginx-served image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
