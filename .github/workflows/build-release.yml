name: Build and Release AuraTorrent

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build AuraTorrent (${{ matrix.npm-step }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        npm-step: ['build', 'build-demo']
        include:
          - npm-step: build
            artifact-name: auratorrent-build
            artifact-path: ./auratorrent
          - npm-step: build-demo
            artifact-name: auratorrent-demo
            artifact-path: ./vuetorrent-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build AuraTorrent
        run: |
          version=$(git describe --tags --exclude latest_nightly 2>/dev/null || node -p "require('./package.json').version")
          npm version --no-commit-hooks --no-git-tag-version --allow-same-version "$version"
          npm run ${{ matrix.npm-step }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 1

  push-nightly:
    name: Push to nightly branch
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: auratorrent-build
          path: ./auratorrent

      - name: Push to nightly-release branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: nightly-release
          folder: ./auratorrent

      - name: Update nightly tag
        run: |
          git tag -f latest_nightly
          git push -f origin latest_nightly

      - name: Zip AuraTorrent
        run: zip -qq -r ./auratorrent.zip ./auratorrent

      - name: Create or update nightly release
        uses: softprops/action-gh-release@v3
        with:
          name: AuraTorrent Nightly Build
          tag_name: latest_nightly
          body: "Latest automated nightly build from the `master` branch."
          prerelease: true
          files: ./auratorrent.zip

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: auratorrent-build
          path: ./auratorrent

      - name: Zip AuraTorrent
        run: zip -qq -r ./auratorrent.zip ./auratorrent

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          name: AuraTorrent ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: ./auratorrent.zip

      - name: Send release to Discord Webhook
        uses: VueTorrent/release-to-discord@main
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}

  push-release:
    name: Push to latest-release branch
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: auratorrent-build
          path: ./auratorrent

      - name: Push to latest-release branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: latest-release
          folder: ./auratorrent

  publish-image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/auratorrent" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha
            type=ref,event=tag

      - name: Build and push nginx-served image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: serve
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign image and attach SBOM attestation (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}

