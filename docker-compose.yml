services:
  qbit:
    image: linuxserver/qbittorrent:latest
    container_name: qbit
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - TZ=Europe/London
      - WEBUI_PORT=8080
    volumes:
      - ./docker/config:/config
      - ./docker/downloads:/downloads
      # Mount AuraTorrent build output (run 'npm run build' first).
      # Vite emits the web root to ./auratorrent/public.
      - ./auratorrent/public:/auratorrent:ro
    ports:
      - '8080:8080'
      - '6881:6881'
      - '6881:6881/udp'

  # Telegram companion bot (AuraBot). Copy bot/.env.example to bot/.env first.
  aurabot:
    build: ./bot
    container_name: aurabot
    restart: unless-stopped
    depends_on:
      - qbit
    env_file:
      - ./bot/.env
    environment:
      # Reach qBittorrent over the compose network instead of localhost
      - QBITTORRENT_URL=http://qbit:8080
      # Persist the dynamically added allowed-users list in the mounted volume
      - ALLOWED_USERS_FILE=/app/data/allowed_users.txt
    volumes:
      - ./docker/aurabot:/app/data
