services:
  qbit:
    image: linuxserver/qbittorrent:latest
    container_name: qbit
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - TZ=Europe/London
      - WEBUI_PORT=8080
    volumes:
      - ./docker/config:/config
      - ./docker/downloads:/downloads
      # Mount AuraTorrent build output (run 'npm run build' first)
      - ./dist:/auratorrent:ro
    ports:
      - '8080:8080'
      - '6881:6881'
      - '6881:6881/udp'
